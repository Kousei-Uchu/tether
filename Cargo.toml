[workspace]
resolver = "2"
members = [
    "crates/tether-proto",
    "crates/tether-core",
    "crates/tether-cli",
    "crates/tether-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
tether-proto = { path = "crates/tether-proto" }
tether-core = { path = "crates/tether-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
gethostname = "0.5"
hex = "0.4"
hmac = "0.12"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
