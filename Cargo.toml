[workspace]
resolver = "2"
members = [
    "crates/tether-proto",
    "crates/tether-core",
    "crates/tether-cli",
    "crates/tether-node",
    "crates/tether-media",
    "crates/tether-input",
    "crates/tether-clipboard",
    "crates/tether-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
tether-proto = { path = "crates/tether-proto" }
tether-core = { path = "crates/tether-core" }
tether-media = { path = "crates/tether-media" }
tether-input = { path = "crates/tether-input" }
tether-clipboard = { path = "crates/tether-clipboard" }
tether-ffi = { path = "crates/tether-ffi" }
anyhow = "1"
arboard = { version = "3", default-features = false }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
enigo = "0.6"
gethostname = "0.5"
hex = "0.4"
hmac = "0.12"
openh264 = "0.9"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
uniffi = { version = "0.32", features = ["tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.14"

# The H.264 encoder is C++ compiled from source. Unoptimised it cannot keep up with video,
# so keep these optimised even in debug builds.
[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.tether-media]
opt-level = 3
