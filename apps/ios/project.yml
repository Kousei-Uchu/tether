# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
# Build the Rust library first:               ../../scripts/build-ios.sh
name: Tether
options:
  bundleIdPrefix: dev.tether
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # The Swift 5 language mode, which any Swift 5.x or 6 compiler accepts. (This setting is the
    # language mode, not the compiler version, so it is not "5.9".)
    SWIFT_VERSION: "5.0"
    # Set your own team in Xcode (Signing & Capabilities) to run on a real phone.
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Tether:
    type: application
    platform: iOS
    sources:
      - path: Tether
    dependencies:
      - framework: Frameworks/TetherFFI.xcframework
        embed: false
    info:
      path: Tether/Info.plist
      properties:
        CFBundleDisplayName: Tether
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Tether connects to your own computers on your local network.
        NSCameraUsageDescription: The camera scans the QR code a computer shows to pair with it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tether.Tether
        GENERATE_INFOPLIST_FILE: NO
